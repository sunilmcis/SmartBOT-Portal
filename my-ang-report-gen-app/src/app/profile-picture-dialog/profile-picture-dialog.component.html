<mat-dialog-actions align="end">

  <button mat-button (click)="onNoClick()">Cancel</button>

  <!-- Show only spinner during preview processing -->
  <div *ngIf="previewInProgress" style="display: flex; align-items: center; gap: 8px;">
    <mat-progress-spinner diameter="24" mode="indeterminate" color="primary"></mat-progress-spinner>
    <span>Preparing image...</span>
  </div>

  <!-- Show Upload button only after preview is done -->
  <button
    *ngIf="!previewInProgress"
    mat-raised-button
    color="primary"
    (click)="uploadProfile()"
    [disabled]="uploadInProgress"
    style="display: flex; align-items: center;"
  >
    <mat-progress-spinner
      *ngIf="uploadInProgress"
      diameter="20"
      mode="indeterminate"
      color="accent"
      style="margin-right: 8px;"
    ></mat-progress-spinner>
    <span *ngIf="!uploadInProgress">Upload</span>
    <span *ngIf="uploadInProgress">Uploading...</span>
  </button>

</mat-dialog-actions>
