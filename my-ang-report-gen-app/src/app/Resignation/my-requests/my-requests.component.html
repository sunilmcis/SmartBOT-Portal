<h2>My Resignation Requests</h2>

<table mat-table [dataSource]="requests" class="mat-elevation-z2 w-100">

  <ng-container matColumnDef="date">
    <th mat-header-cell *matHeaderCellDef> Submitted </th>
    <td mat-cell *matCellDef="let r">{{ r.created_at | date }}</td>
  </ng-container>

  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef>Status</th>
    <td mat-cell *matCellDef="let r">
      <mat-chip color="primary">{{ r.status }}</mat-chip>
    </td>
  </ng-container>

  <ng-container matColumnDef="lastDay">
    <th mat-header-cell *matHeaderCellDef> Last Day </th>
    <td mat-cell *matCellDef="let r">{{ r.approved_last_day || '-' }}</td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="['date','status','lastDay']"></tr>
  <tr mat-row *matRowDef="let row; columns: ['date','status','lastDay'];"></tr>

</table>
