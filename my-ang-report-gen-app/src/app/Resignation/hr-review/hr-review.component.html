<h2>HR Approval</h2>

<table mat-table [dataSource]="requests" class="mat-elevation-z2 w-100">

  <ng-container matColumnDef="employee">
    <th mat-header-cell *matHeaderCellDef>Employee</th>
    <td mat-cell *matCellDef="let r">{{ r.employee_name }}</td>
  </ng-container>

  <ng-container matColumnDef="manager">
    <th mat-header-cell *matHeaderCellDef>Manager</th>
    <td mat-cell *matCellDef="let r">{{ r.manager_name }}</td>
  </ng-container>

  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef>Status</th>
    <td mat-cell *matCellDef="let r">
      <mat-chip>{{ r.status }}</mat-chip>
    </td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Action</th>
    <td mat-cell *matCellDef="let r">
      <button mat-button color="primary" (click)="openApproveDialog(r)">Approve</button>
      <button mat-button color="warn" (click)="reject(r)">Reject</button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="['employee','manager','status','actions']"></tr>
  <tr mat-row *matRowDef="let row; columns: ['employee','manager','status','actions'];"></tr>

</table>
