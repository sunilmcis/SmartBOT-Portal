<div class="login-wrapper">
  <div class="login-container">
    <h2>Login</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>

      <!-- Username -->
      <div class="form-group">
        <label for="username">Username</label>
        <input
          id="username"
          type="text"
          formControlName="username"
          [class.invalid]="submitted && loginForm.get('username')?.invalid"
          autocomplete="username"
          placeholder="Enter your username"
        />
        <div class="error" *ngIf="submitted && loginForm.get('username')?.invalid">
          Username is required.
        </div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          [class.invalid]="submitted && loginForm.get('password')?.invalid"
          autocomplete="current-password"
          placeholder="Enter your password"
        />
        <div class="error" *ngIf="submitted && loginForm.get('password')?.invalid">
          Password is required.
        </div>
      </div>

      <!-- Submit Button -->
      <div class="form-actions">
        <button type="submit" [disabled]="isLoading">
          {{ isLoading ? 'Logging in...' : 'Login' }}
        </button>
      </div>
    </form>
    <hr>

    <button
      type="button"
      class="ms-login-btn"
      (click)="loginWithMicrosoft()">

      Sign in with Microsoft 365

    </button>

    <!-- Extra Links -->
    <div class="extras">
      <button type="button" class="forgot-btn" (click)="goToForgotPassword()">Forgot Password?</button>
<!--      <button type="button" class="register-btn" (click)="goToRegister()">New user? Register</button>-->
    </div>
  </div>
</div>
