<div class="register-wrapper">
  <div class="register-container">
    <h2>Customer Registration</h2>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" novalidate>

      <!-- First Name -->
      <div class="form-group">
        <label for="firstName">First Name</label>
        <input id="firstName" type="text" formControlName="firstName" />
        <div class="error" *ngIf="submitted && registerForm.get('firstName')?.invalid">
          First Name is required.
        </div>
      </div>

      <!-- Last Name -->
      <div class="form-group">
        <label for="lastName">Last Name</label>
        <input id="lastName" type="text" formControlName="lastName" />
        <div class="error" *ngIf="submitted && registerForm.get('lastName')?.invalid">
          Last Name is required.
        </div>
      </div>

      <!-- Role -->
      <div class="form-group">
        <label for="role">Role</label>
        <input id="role" type="text" formControlName="role" />
        <div class="error" *ngIf="submitted && registerForm.get('role')?.invalid">
          Role is required.
        </div>
      </div>

      <!-- Department -->
      <div class="form-group">
        <label for="department">Department</label>
        <input id="department" type="text" formControlName="department" />
        <div class="error" *ngIf="submitted && registerForm.get('department')?.invalid">
          Department is required.
        </div>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" />
        <div class="error" *ngIf="submitted && registerForm.get('email')?.invalid">
          <span *ngIf="registerForm.get('email')?.errors?.['required']">Email is required.</span>
          <span *ngIf="registerForm.get('email')?.errors?.['email']">Invalid email format.</span>
        </div>
      </div>

      <!-- Phone -->
      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input id="phone" type="text" formControlName="phone" />
        <div class="error" *ngIf="submitted && registerForm.get('phone')?.invalid">
          Phone number is required.
        </div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" />
        <div class="error" *ngIf="submitted && registerForm.get('password')?.invalid">
          Password is required (minimum 6 characters).
        </div>
      </div>

      <!-- Re-Type Password -->
      <div class="form-group">
        <label for="rPassword">Re-Type Password</label>
        <input id="rPassword" type="password" formControlName="rPassword" />
        <div class="error" *ngIf="submitted && registerForm.get('rPassword')?.invalid">
          Please re-type password.
        </div>
        <div class="error" *ngIf="submitted && passwordMismatch">
          Passwords do not match.
        </div>
      </div>

      <button type="submit">Register</button>
    </form>
  </div>
</div>
