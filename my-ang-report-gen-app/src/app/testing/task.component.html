<mat-card class="task-form-card">
  <mat-card-title>Create New Task</mat-card-title>
  <mat-card-content>
    <form class="task-form">
      <mat-form-field appearance="fill">
        <mat-label>Title</mat-label>
        <input matInput placeholder="Enter task title" [(ngModel)]="newTask.title" name="title" required />
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>Assigned To</mat-label>
        <input matInput placeholder="Enter assignee name" [(ngModel)]="newTask.assigned_to" name="assigned_to" />
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>Description</mat-label>
        <textarea matInput placeholder="Task description" [(ngModel)]="newTask.description" name="description"></textarea>
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>Status</mat-label>
        <mat-select [(ngModel)]="newTask.status" name="status">
          <mat-option value="Pending">Pending</mat-option>
          <mat-option value="In Progress">In Progress</mat-option>
          <mat-option value="Completed">Completed</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>Due Date</mat-label>
        <input matInput [matDatepicker]="picker" [(ngModel)]="newTask.due_date" name="due_date" />
        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>

      <div class="button-group">
        <button mat-raised-button color="primary" (click)="createTask()">Create Task</button>
      </div>
    </form>
  </mat-card-content>
</mat-card>

<hr />

<div class="task-list">
  <mat-card class="task-card" *ngFor="let task of tasks">
    <mat-card-title>{{ task.title }}</mat-card-title>
    <mat-card-subtitle>Status: {{ task.status }}</mat-card-subtitle>
    <mat-card-content>
      <p>{{ task.description }}</p>
      <p><strong>Assigned To:</strong> {{ task.assigned_to }}</p>
      <p><strong>Due Date:</strong> {{ task.due_date | date: 'shortDate' }}</p>

      <mat-form-field appearance="fill" class="status-field">
        <mat-label>Update Status</mat-label>
        <mat-select [value]="task.status" (selectionChange)="updateStatus(task.id!, $event.value)">
          <mat-option value="Pending">Pending</mat-option>
          <mat-option value="In Progress">In Progress</mat-option>
          <mat-option value="Completed">Completed</mat-option>
        </mat-select>
      </mat-form-field>
    </mat-card-content>
  </mat-card>

  <div style="margin-top: 20px;">
    <button mat-stroked-button color="accent" (click)="goBack()">
      ← Back
    </button>
  </div>

</div>
